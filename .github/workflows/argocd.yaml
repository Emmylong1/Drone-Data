apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: devops-interview
  namespace: argocd

spec:
  project: default

  source:
    repoURL: "https://github.com/Emmylong1/Drone-Data.git"
    targetRevision: HEAD
    path: manifests

  destination:
    server: https://kubernetes.default.svc
    namespace: prod

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
